# Keeps the IE11 build tools, and the pinned versions of the actions that
# check this repository, current. Minor and patch updates arrive as one
# grouped pull request a week; majors come one at a time, since those are the
# ones that need reading. A tool update can change public/legacy/: the
# "IE11 build is current" check then fails until the rebuilt output is
# committed to the Dependabot branch (npm ci && npm run build:legacy).

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Nothing under a week old, which is when most malicious releases are
    # caught and pulled.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
