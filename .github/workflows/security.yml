# Is anything insecure on its way in?
#
# Dependencies with known vulnerabilities, credentials committed to the
# history, and code patterns that lead to injection, path traversal, XSS and
# the like. Also runs weekly, because new advisories are published without
# any code changing.
#
# The repository is public, so GitHub's CodeQL code scanning is free here.
# Tool images are pinned by digest: they read the whole repository.

name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1" # Mondays, 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      # The app has no runtime dependencies; everything in the lockfile is a
      # build tool for the IE11 bundle, and part of that bundle (core-js,
      # whatwg-fetch) ships to browsers. So every dependency is audited, not
      # only production ones. High and critical fail the check.
      - name: Audit the lockfile
        run: npm audit --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: a key deleted in a later commit is still leaked.
          fetch-depth: 0
          persist-credentials: false
      # False positives, if any, are listed with reasons in .gitleaksignore.
      - name: Scan every commit with gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --no-banner --exit-code 1 .

  codeql:
    name: Static analysis (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Upload the results to code scanning (the Security tab and PR alerts).
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          build-mode: none
          # security-extended adds lower-precision queries (ReDoS, path
          # injection) that matter for a server reading user input.
          queries: security-extended
          # Generated, transpiled copy of public/app.js plus vendored
          # polyfills: findings there would duplicate the source or belong
          # upstream.
          config: |
            paths-ignore:
              - public/legacy
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:javascript-typescript
